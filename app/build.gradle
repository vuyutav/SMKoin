plugins {
    id 'com.android.application'
}

// The publishable/anon key is a public client key protected by Supabase RLS.
// Load local config without ever writing its contents to the build log.
def supabaseProperties = new Properties()
// Accept either repository-root .env or app/.env. Root configuration wins if both exist.
def supabaseEnvFiles = [project.file('.env'), rootProject.file('.env')].unique()
supabaseEnvFiles.findAll { it.isFile() }.each { envFile ->
    envFile.withInputStream { supabaseProperties.load(it) }
}
def readSupabaseConfig = { String gradleProperty, String environmentName, List<String> fileProperties ->
    def value = project.findProperty(gradleProperty)
    if (value == null) value = System.getenv(environmentName)
    if (value == null && fileProperties.contains('PROJECT_URL')) value = System.getenv('PROJECT_URL')
    if (value == null && (fileProperties.contains('ANON_KEY') || fileProperties.contains('PUBLISHABLE_KEY'))) {
        value = System.getenv('PUBLISHABLE_KEY')
        if (value == null) value = System.getenv('ANON_KEY')
    }
    if (value == null) {
        for (String propertyName : fileProperties) {
            value = supabaseProperties.getProperty(propertyName)
            if (value != null && !value.trim().isEmpty()) break
        }
    }
    return value == null ? '' : value.toString().trim().replaceAll('^(["\'])(.*)\\1$', '$2')
}
def escapeBuildConfig = { String value -> value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '') }
def supabaseUrl = readSupabaseConfig('SMKOIN_SUPABASE_URL', 'SMKOIN_SUPABASE_URL', ['PROJECT_URL', 'project_url'])
def supabaseKey = readSupabaseConfig('SMKOIN_SUPABASE_KEY', 'SMKOIN_SUPABASE_KEY', ['PUBLISHABLE_KEY', 'publishable_key'])
if (!supabaseKey) supabaseKey = readSupabaseConfig('SMKOIN_SUPABASE_ANON_KEY', 'SMKOIN_SUPABASE_ANON_KEY', ['ANON_KEY', 'anon_key'])
if (supabaseKey.startsWith('sb_secret_')) {
    throw new GradleException('A Supabase secret key cannot be used by the Android client. Configure a publishable or anon key.')
}
if (supabaseKey.count('.') == 2) {
    try {
        def jwtPayload = new String(java.util.Base64.urlDecoder.decode(supabaseKey.split('\\.')[1]), 'UTF-8').replaceAll('\\s', '')
        if (jwtPayload.contains('"role":"service_role"')) {
            throw new GradleException('A Supabase service-role key cannot be used by the Android client.')
        }
    } catch (IllegalArgumentException ignored) {
        // Non-JWT publishable keys are expected; malformed legacy keys fail at request time.
    }
}

android {
    // PENTING: JANGAN tambahkan 'namespace' di sini.
    // AGP 7.2.1 belum mendukung 'namespace'.
    // Package tetap didefinisikan di AndroidManifest.xml.
    compileSdk 32

    defaultConfig {
        applicationId "com.example.smkoin"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'SUPABASE_URL', '"' + escapeBuildConfig(supabaseUrl) + '"'
        buildConfigField 'String', 'SUPABASE_API_KEY', '"' + escapeBuildConfig(supabaseKey) + '"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // CameraX 1.1 supports the project's existing API 21 minimum and AGP-era toolchain.
    implementation 'androidx.camera:camera-camera2:1.1.0'
    implementation 'androidx.camera:camera-lifecycle:1.1.0'
    implementation 'androidx.camera:camera-view:1.1.0'
    // ZXing core decodes QR frames in Java without raising the app's minSdk to 23.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
